name: Validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run static validation
        run: npm run validate:static

      - name: Run extension-host tests
        run: xvfb-run -a npm run test:extension

      - name: Build VSIX
        run: npm run vsix

      - name: Validate package contents
        run: npm run package:list

      - name: Upload VSIX
        uses: actions/upload-artifact@v7
        with:
          name: justapi-vsix
          path: justapi-*.vsix
          if-no-files-found: error
          retention-days: 14
